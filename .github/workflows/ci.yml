name: Xneon Reborn CI

on:
  push:
    branches:
      - xneon-reborn
  pull_request:
    branches:
      - main
      - xneon-reborn

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configure private workspace registry
        env:
          FORGEJO_NPM_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if [ -n "$FORGEJO_NPM_TOKEN" ]; then
            printf "%s\n" "//git.xneon.org/api/packages/MAINER4IK/npm/:_authToken=$FORGEJO_NPM_TOKEN" >> .npmrc
          fi
          printf "%s\n" "always-auth=true" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local workspace packages
        run: pnpm -r --filter "./packages/*" run build

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Run crash diagnostics tests
        run: pnpm run test:diagnostics

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Build Electron main process
        run: pnpm run build:electron

      - name: Check Minecraft smoke-test script syntax
        run: node --check scripts/smoke-minecraft-launch.mjs
