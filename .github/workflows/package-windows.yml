name: Xneon Reborn Windows Package

on:
  push:
    branches:
      - xneon-reborn

permissions:
  contents: read

jobs:
  package-windows:
    if: contains(github.event.head_commit.message, '[package-windows]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configure private workspace registry
        env:
          FORGEJO_NPM_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        shell: pwsh
        run: |
          if ($env:FORGEJO_NPM_TOKEN) {
            Add-Content .npmrc "//git.xneon.org/api/packages/MAINER4IK/npm/:_authToken=$env:FORGEJO_NPM_TOKEN"
          }
          Add-Content .npmrc "always-auth=true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local workspace packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Build app
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ELY_CLIENT_ID: ${{ secrets.ELY_CLIENT_ID }}
          ELY_CLIENT_SECRET: ${{ secrets.ELY_CLIENT_SECRET }}
          ELY_DEVICE_CLIENT_ID: ${{ secrets.ELY_DEVICE_CLIENT_ID }}
          XN_CLIENT_ID: ${{ secrets.XN_CLIENT_ID }}
          XN_CLIENT_SECRET: ${{ secrets.XN_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_DEVICE_CLIENT_ID: ${{ secrets.MICROSOFT_DEVICE_CLIENT_ID }}
        run: pnpm run build

      - name: Package Windows installer and portable ZIP
        id: package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --win nsis zip --publish never

      - name: Smoke-test installed Windows application
        shell: pwsh
        run: ./scripts/smoke-windows-package.ps1

      - name: Set up Java 17 for Minecraft launch test
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Launch vanilla Minecraft 1.20.1 offline
        run: node scripts/smoke-minecraft-launch.mjs

      - name: Upload Windows artifacts
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: Xneon-Reborn-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 7

  minecraft-client:
    if: contains(github.event.head_commit.message, '[package-windows]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configure private workspace registry
        env:
          FORGEJO_NPM_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if [ -n "$FORGEJO_NPM_TOKEN" ]; then
            printf "%s\\n" "//git.xneon.org/api/packages/MAINER4IK/npm/:_authToken=$FORGEJO_NPM_TOKEN" >> .npmrc
          fi
          printf "%s\\n" "always-auth=true" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local workspace packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxinerama1 libxcursor1 libxi6 xdotool tesseract-ocr scrot imagemagick

      - name: Launch vanilla Minecraft client to title screen
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null node scripts/smoke-minecraft-client.mjs

      - name: Upload gameplay smoke logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Xneon-Minecraft-Client-Logs
          path: |
            ${{ runner.temp }}/xneon-minecraft-client-smoke/logs
            ${{ runner.temp }}/xneon-minecraft-client-smoke/screenshots
          if-no-files-found: ignore
          retention-days: 3
